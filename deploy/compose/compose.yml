name: go-admin-plus

services:
  postgres:
    image: postgres:17.11-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: go_admin
      POSTGRES_USER: go_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_admin -d go_admin"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.10.0-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ${GO_ADMIN_API_IMAGE:-go-admin-api}:${GO_ADMIN_VERSION:-dev}
    platform: linux/amd64
    command: ["migrate", "--config", "/run/secrets/go_admin_settings.yml"]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    secrets:
      - source: go_admin_settings
        target: go_admin_settings.yml
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  api:
    image: ${GO_ADMIN_API_IMAGE:-go-admin-api}:${GO_ADMIN_VERSION:-dev}
    platform: linux/amd64
    command:
      - server
      - --profile
      - server
      - --config
      - /run/secrets/go_admin_settings.yml
      - --files
      - /srv/go-admin/static/uploadfile
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    secrets:
      - source: go_admin_settings
        target: go_admin_settings.yml
    volumes:
      - server-files:/srv/go-admin/static/uploadfile
    networks:
      - backend
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    image: ${GO_ADMIN_WEB_IMAGE:-go-admin-web}:${GO_ADMIN_VERSION:-dev}
    platform: linux/amd64
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0750
      - /var/run/nginx:size=1m,uid=101,gid=101,mode=0750
    ports:
      - "${GO_ADMIN_WEB_BIND:-127.0.0.1}:${GO_ADMIN_WEB_PORT:-8080}:8080"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

secrets:
  go_admin_settings:
    file: ./runtime/settings.yml
  postgres_password:
    file: ./runtime/secrets/postgres_password

volumes:
  postgres-data:
  redis-data:
  server-files:

networks:
  edge:
  backend:
    internal: true
