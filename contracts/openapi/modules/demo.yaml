openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Demo Products API
  version: 1.0.0
  description: Reference product CRUD module.
  license: {name: MIT, identifier: MIT}
servers: [{url: /api}]
x-go-admin-module: demo
x-go-admin-codegen:
  owner: demo
  goPackage: demotransport
  goOutput: go-admin-plus/internal/modules/demo/transport/openapi.gen.go
  typescriptOutput: go-admin-plus-ui/packages/domains/demo/src/generated
security: [{SessionCookie: []}]
paths:
  /demo/products:
    get:
      operationId: listDemoProducts
      summary: List products within the caller data scope
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: sort, in: query, schema: {$ref: '#/components/schemas/ProductSort'}}
        - {name: direction, in: query, schema: {$ref: '#/components/schemas/SortDirection'}}
      responses:
        '200': {description: Scope-filtered products., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ProductPage'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
    post:
      operationId: createDemoProduct
      summary: Create a product
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateProductRequest'}}}}
      responses:
        '201': {description: Created product., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /demo/products/batch-delete:
    post:
      operationId: deleteDemoProducts
      summary: Delete products atomically
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeleteProductsRequest'}}}}
      responses:
        '204': {description: Products deleted., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /demo/products/{productId}:
    parameters: [{$ref: '#/components/parameters/ProductId'}]
    get:
      operationId: getDemoProduct
      summary: Get a product within the caller data scope
      responses:
        '200': {description: Product detail., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
    patch:
      operationId: updateDemoProduct
      summary: Update a product with optimistic concurrency
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProductRequest'}}}}
      responses:
        '200': {description: Updated product., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
components:
  securitySchemes:
    SessionCookie: {$ref: ../components/security-schemes.yaml#/SessionCookie}
    CsrfToken: {$ref: ../components/security-schemes.yaml#/CsrfToken}
  parameters:
    ProductId: {name: productId, in: path, required: true, schema: {type: string, format: uuid}}
  headers:
    CsrfToken: {required: true, schema: {type: string, minLength: 43, maxLength: 43}}
    SetCookie: {required: false, schema: {type: string, maxLength: 4096}}
  schemas:
    ProductSort: {type: string, enum: [sku, name, priceCents, updatedAt], default: updatedAt}
    SortDirection: {type: string, enum: [ascending, descending], default: descending}
    ProductStatus: {type: string, enum: [active, inactive]}
    Product:
      type: object
      additionalProperties: false
      required: [id, sku, name, description, priceCents, status, revision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        sku: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{2,31}$'}
        name: {type: string, minLength: 3, maxLength: 120}
        description: {type: string, maxLength: 500}
        priceCents: {type: integer, minimum: 0, maximum: 100000000}
        status: {$ref: '#/components/schemas/ProductStatus'}
        revision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProductInput:
      type: object
      additionalProperties: false
      required: [sku, name, description, priceCents, status]
      properties:
        sku: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{2,31}$'}
        name: {type: string, minLength: 3, maxLength: 120}
        description: {type: string, maxLength: 500}
        priceCents: {type: integer, minimum: 0, maximum: 100000000}
        status: {$ref: '#/components/schemas/ProductStatus'}
    CreateProductRequest: {$ref: '#/components/schemas/ProductInput'}
    UpdateProductRequest:
      type: object
      additionalProperties: false
      required: [sku, name, description, priceCents, status, revision]
      properties:
        sku: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{2,31}$'}
        name: {type: string, minLength: 3, maxLength: 120}
        description: {type: string, maxLength: 500}
        priceCents: {type: integer, minimum: 0, maximum: 100000000}
        status: {$ref: '#/components/schemas/ProductStatus'}
        revision: {type: integer, minimum: 1}
    ProductPage:
      type: object
      additionalProperties: false
      required: [rows, total]
      properties:
        rows: {type: array, items: {$ref: '#/components/schemas/Product'}}
        total: {type: integer, minimum: 0}
    DeleteProductTarget:
      type: object
      additionalProperties: false
      required: [id, revision]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
    DeleteProductsRequest:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/DeleteProductTarget'}}
    Problem: {$ref: ../components/schemas.yaml#/Problem}
  responses:
    AuthenticationProblem: {description: Authentication required., content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    AuthorizationProblem: {description: Authorization failed., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    ValidationProblem: {description: Request invalid., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    NotFoundProblem: {description: Resource not found., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    ConflictProblem: {description: Resource conflict., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    InternalProblem: {description: Internal failure., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
