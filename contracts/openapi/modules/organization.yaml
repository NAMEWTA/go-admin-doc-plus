openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Organization API
  version: 1.0.0
  description: Department tree and position management.
  license: {name: MIT, identifier: MIT}
servers:
  - url: /api
x-go-admin-module: organization
x-go-admin-codegen:
  owner: organization
  goPackage: organizationtransport
  goOutput: go-admin-plus/internal/modules/organization/transport/openapi.gen.go
  typescriptOutput: go-admin-plus-ui/packages/domains/organization/src/generated
security:
  - SessionCookie: []
paths:
  /organization/departments:
    get:
      operationId: listOrganizationDepartments
      summary: List the authorized department tree
      responses:
        '200': {description: Deterministically ordered flat tree projection; parentId defines edges., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Department'}}}}}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
    post:
      operationId: createOrganizationDepartment
      summary: Create a department
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DepartmentInput'}}}}
      responses:
        '201': {description: Created department., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Department'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /organization/departments/{departmentId}:
    parameters: [{$ref: '#/components/parameters/DepartmentId'}]
    patch:
      operationId: updateOrganizationDepartment
      summary: Update a department and its parent relationship
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DepartmentInput'}}}}
      responses:
        '200': {description: Updated department., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Department'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
    delete:
      operationId: deleteOrganizationDepartment
      summary: Delete an unprotected and unreferenced department
      security: [{SessionCookie: [], CsrfToken: []}]
      responses:
        '204': {description: Department deleted., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /organization/positions:
    get:
      operationId: listOrganizationPositions
      summary: List positions
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Position page., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/PositionPage'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
    post:
      operationId: createOrganizationPosition
      summary: Create a position in a department
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PositionInput'}}}}
      responses:
        '201': {description: Created position., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Position'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /organization/positions/{positionId}:
    parameters: [{$ref: '#/components/parameters/PositionId'}]
    patch:
      operationId: updateOrganizationPosition
      summary: Update a position and its department relationship
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PositionInput'}}}}
      responses:
        '200': {description: Updated position., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Position'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
    delete:
      operationId: deleteOrganizationPosition
      summary: Delete an unprotected position
      security: [{SessionCookie: [], CsrfToken: []}]
      responses:
        '204': {description: Position deleted., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
components:
  securitySchemes:
    SessionCookie: {$ref: ../components/security-schemes.yaml#/SessionCookie}
    CsrfToken: {$ref: ../components/security-schemes.yaml#/CsrfToken}
  parameters:
    DepartmentId: {name: departmentId, in: path, required: true, schema: {$ref: '#/components/schemas/Identifier'}}
    PositionId: {name: positionId, in: path, required: true, schema: {$ref: '#/components/schemas/Identifier'}}
  headers:
    CsrfToken: {description: Stable anti-forgery token for the authenticated Session family., schema: {type: string, minLength: 43, maxLength: 43}}
    SetCookie: {description: Replacement session cookie when periodic rotation occurs., schema: {type: string}}
  responses:
    ValidationProblem: {description: Request validation failed., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    AuthenticationProblem: {description: Authentication is required., content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    AuthorizationProblem: {description: Authorization failed., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    NotFoundProblem: {description: Resource was not found., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    ConflictProblem: {description: Resource conflicts with current state., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    InternalProblem: {description: Internal failure., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    Problem: {$ref: ../components/schemas.yaml#/Problem}
    Identifier: {type: string, minLength: 16, maxLength: 64}
    StableKey: {type: string, minLength: 3, maxLength: 64, pattern: '^[a-z0-9][a-z0-9_-]*$'}
    Department:
      type: object
      additionalProperties: false
      required: [id, key, name, sortOrder, protected]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        key: {$ref: '#/components/schemas/StableKey'}
        name: {type: string, minLength: 1, maxLength: 100}
        parentId: {$ref: '#/components/schemas/Identifier'}
        sortOrder: {type: integer, minimum: -1000000, maximum: 1000000}
        protected: {type: boolean}
    DepartmentInput:
      type: object
      additionalProperties: false
      required: [key, name, parentId, sortOrder]
      properties:
        key: {$ref: '#/components/schemas/StableKey'}
        name: {type: string, minLength: 1, maxLength: 100}
        parentId: {$ref: '#/components/schemas/Identifier'}
        sortOrder: {type: integer, minimum: -1000000, maximum: 1000000}
    Position:
      type: object
      additionalProperties: false
      required: [id, key, name, departmentId, enabled, protected]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        key: {$ref: '#/components/schemas/StableKey'}
        name: {type: string, minLength: 1, maxLength: 100}
        departmentId: {$ref: '#/components/schemas/Identifier'}
        enabled: {type: boolean}
        protected: {type: boolean}
    PositionInput:
      type: object
      additionalProperties: false
      required: [key, name, departmentId, enabled]
      properties:
        key: {$ref: '#/components/schemas/StableKey'}
        name: {type: string, minLength: 1, maxLength: 100}
        departmentId: {$ref: '#/components/schemas/Identifier'}
        enabled: {type: boolean}
    PositionPage:
      type: object
      additionalProperties: false
      required: [rows, total]
      properties:
        rows: {type: array, items: {$ref: '#/components/schemas/Position'}}
        total: {type: integer, minimum: 0}
