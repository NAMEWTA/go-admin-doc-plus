openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: IAM Administration API
  version: 1.0.0
  description: User, role, menu, Permission Code, data scope, and capability manifest management.
  license: {name: MIT, identifier: MIT}
servers:
  - url: /api
x-go-admin-module: iam-administration
x-go-admin-codegen:
  owner: iam
  goPackage: administrationtransport
  goOutput: go-admin-plus/internal/modules/iam/administration/transport/openapi.gen.go
  typescriptOutput: go-admin-plus-ui/packages/domains/iam/src/administration/generated
security:
  - SessionCookie: []
paths:
  /iam/administration/manifest:
    get:
      operationId: getIamCapabilityManifest
      summary: Get the current capability manifest
      responses:
        '200': {description: Current database-backed capabilities., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/CapabilityManifest'}}}}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/users:
    get:
      operationId: listIamUsers
      summary: List users within the caller data scope
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Scope-filtered users., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/UserPage'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
    post:
      operationId: createIamUser
      summary: Create a user
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateUserRequest'}}}}
      responses:
        '201': {description: Created user., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/users/{userId}:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    get:
      operationId: getIamUser
      summary: Get a user within the caller data scope
      responses:
        '200': {description: Scope-filtered user detail., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
    patch:
      operationId: updateIamUser
      summary: Update a user
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateUserRequest'}}}}
      responses:
        '200': {description: Updated user., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/users/{userId}/organization:
    put:
      operationId: setIamUserOrganization
      summary: Replace a user's primary department and positions
      parameters: [{$ref: '#/components/parameters/UserId'}]
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountOrganizationRequest'}}}}
      responses:
        '204': {description: Account organization assignments replaced., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/users/{userId}/deletion:
    parameters: [{$ref: '#/components/parameters/UserId'}]
    post:
      operationId: startIamUserDeletion
      summary: Start the single-account deletion lifecycle
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StartAccountDeletionRequest'}}}}
      responses:
        '202': {description: Account deletion queued., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AccountDeletion'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
    get:
      operationId: getIamUserDeletion
      summary: Read the current account deletion lifecycle
      responses:
        '200': {description: Current account deletion state., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AccountDeletion'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/users/{userId}/deletion/cancel:
    post:
      operationId: cancelIamUserDeletion
      summary: Cancel an account deletion before worker claim
      parameters: [{$ref: '#/components/parameters/UserId'}]
      security: [{SessionCookie: [], CsrfToken: []}]
      responses:
        '204': {description: Queued account deletion canceled., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/users/{userId}/roles:
    put:
      operationId: setIamUserRoles
      summary: Replace user role assignments
      parameters: [{$ref: '#/components/parameters/UserId'}]
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SetUserRolesRequest'}}}}
      responses:
        '204': {description: Assignments replaced., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/users/{userId}/password:
    put:
      operationId: resetIamUserPassword
      summary: Reset a user password and revoke sessions
      parameters: [{$ref: '#/components/parameters/UserId'}]
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResetPasswordRequest'}}}}
      responses:
        '204': {description: Password replaced and all target sessions revoked., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/roles:
    get:
      operationId: listIamRoles
      summary: List roles
      responses:
        '200': {description: Roles., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Role'}}}}}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
    post:
      operationId: createIamRole
      summary: Create a role
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateRoleRequest'}}}}
      responses:
        '201': {description: Created role., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Role'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/roles/{roleId}:
    parameters: [{$ref: '#/components/parameters/RoleId'}]
    patch:
      operationId: updateIamRole
      summary: Update a role
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateRoleRequest'}}}}
      responses:
        '204': {description: Role updated., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
    delete:
      operationId: deleteIamRole
      summary: Delete a role
      security: [{SessionCookie: [], CsrfToken: []}]
      responses:
        '204': {description: Role deleted., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/roles/{roleId}/grants:
    put:
      operationId: setIamRoleGrants
      summary: Replace role Permission Code and menu grants
      parameters: [{$ref: '#/components/parameters/RoleId'}]
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SetRoleGrantsRequest'}}}}
      responses:
        '204': {description: Grants replaced., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/roles/{roleId}/data-scope:
    put:
      operationId: setIamRoleDataScope
      summary: Replace a role's five-mode data scope
      parameters: [{$ref: '#/components/parameters/RoleId'}]
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleDataScopeRequest'}}}}
      responses:
        '204': {description: Role data scope replaced., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/menus:
    get:
      operationId: listIamMenus
      summary: List menus
      responses:
        '200': {description: Menus., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Menu'}}}}}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
    post:
      operationId: createIamMenu
      summary: Create a menu
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MenuInput'}}}}
      responses:
        '201': {description: Created menu., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Menu'}}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/menus/{menuId}:
    parameters: [{$ref: '#/components/parameters/MenuId'}]
    patch:
      operationId: updateIamMenu
      summary: Update a menu
      security: [{SessionCookie: [], CsrfToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MenuInput'}}}}
      responses:
        '204': {description: Menu updated., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}}
        '400': {$ref: '#/components/responses/ValidationProblem'}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
    delete:
      operationId: deleteIamMenu
      summary: Delete a menu
      security: [{SessionCookie: [], CsrfToken: []}]
      responses:
        '204': {description: Menu deleted., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '404': {$ref: '#/components/responses/NotFoundProblem'}
        '409': {$ref: '#/components/responses/ConflictProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
  /iam/administration/permissions:
    get:
      operationId: listIamPermissions
      summary: List stable Permission Codes
      responses:
        '200': {description: Stable Permission Codes., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Permission'}}}}}
        '401': {$ref: '#/components/responses/AuthenticationProblem'}
        '403': {$ref: '#/components/responses/AuthorizationProblem'}
        '500': {$ref: '#/components/responses/InternalProblem'}
components:
  securitySchemes:
    SessionCookie: {$ref: ../components/security-schemes.yaml#/SessionCookie}
    CsrfToken: {$ref: ../components/security-schemes.yaml#/CsrfToken}
  parameters:
    UserId: {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/Identifier'}}
    RoleId: {name: roleId, in: path, required: true, schema: {$ref: '#/components/schemas/Identifier'}}
    MenuId: {name: menuId, in: path, required: true, schema: {$ref: '#/components/schemas/Identifier'}}
  headers:
    CsrfToken: {description: Stable anti-forgery token for the authenticated Session family., schema: {type: string, minLength: 43, maxLength: 43}}
    SetCookie: {description: Replacement session cookie when periodic rotation occurs., schema: {type: string}}
  responses:
    ValidationProblem: {description: Request validation failed., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    AuthenticationProblem: {description: Authentication is required., content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    AuthorizationProblem: {description: Authorization failed., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    NotFoundProblem: {description: Resource was not found., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    ConflictProblem: {description: Resource conflicts with current state., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    InternalProblem: {description: Internal failure., headers: {X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}, Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    Problem: {$ref: ../components/schemas.yaml#/Problem}
    Identifier: {type: string, minLength: 16, maxLength: 64}
    BaseDataScope: {type: string, enum: [all, self], description: Initial scope and compatibility input for role metadata writes. Extended effective scopes are preserved and replaced through the dedicated role data-scope operation.}
    DataScope: {type: string, enum: [all, self, organization, organization-tree, custom]}
    User:
      type: object
      additionalProperties: false
      required: [id, username, displayName, email, disabled, roleIds]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        username: {type: string, minLength: 3, maxLength: 64}
        displayName: {type: string, minLength: 1, maxLength: 80}
        email: {type: string, format: email, maxLength: 254}
        disabled: {type: boolean}
        roleIds: {type: array, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/Identifier'}}
    UserPage:
      type: object
      additionalProperties: false
      required: [rows, total]
      properties:
        rows: {type: array, items: {$ref: '#/components/schemas/User'}}
        total: {type: integer, minimum: 0}
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, email, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        displayName: {type: string, minLength: 1, maxLength: 80}
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 128}
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, enabled]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 80}
        email: {type: string, format: email, maxLength: 254}
        enabled: {type: boolean}
    SetUserRolesRequest:
      type: object
      additionalProperties: false
      required: [roleIds]
      properties: {roleIds: {type: array, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/Identifier'}}}
    AccountOrganizationRequest:
      type: object
      additionalProperties: false
      required: [positionIds]
      properties:
        primaryDepartmentId: {$ref: '#/components/schemas/Identifier'}
        positionIds: {type: array, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/Identifier'}}
    RoleDataScopeRequest:
      type: object
      additionalProperties: false
      required: [scope, departmentIds]
      properties:
        scope: {$ref: '#/components/schemas/DataScope'}
        departmentIds: {type: array, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/Identifier'}}
    StartAccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [strategy]
      properties:
        strategy: {type: string, enum: [transfer, purge]}
        transferTargetId: {$ref: '#/components/schemas/Identifier'}
        purgeConfirmed: {type: boolean, default: false}
    AccountDeletion:
      type: object
      additionalProperties: false
      required: [id, accountId, strategy, status, auditReference, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        accountId: {$ref: '#/components/schemas/Identifier'}
        strategy: {type: string, enum: [transfer, purge]}
        transferTargetId: {$ref: '#/components/schemas/Identifier'}
        status: {type: string, enum: [queued, claimed, completed, failed]}
        auditReference: {type: string, minLength: 1, maxLength: 128}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties: {password: {type: string, minLength: 12, maxLength: 128}}
    Role:
      type: object
      additionalProperties: false
      required: [id, key, name, dataScope, enabled, protected, permissionCodes, menuIds]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        key: {type: string, minLength: 3, maxLength: 64, pattern: '^[a-z0-9][a-z0-9_-]*$'}
        name: {type: string, minLength: 1, maxLength: 100}
        dataScope: {$ref: '#/components/schemas/DataScope'}
        enabled: {type: boolean}
        protected: {type: boolean}
        permissionCodes: {type: array, maxItems: 100, uniqueItems: true, items: {type: string, minLength: 3, maxLength: 100}}
        menuIds: {type: array, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/Identifier'}}
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required: [key, name, dataScope]
      properties:
        key: {type: string, minLength: 3, maxLength: 64, pattern: '^[a-z0-9][a-z0-9_-]*$'}
        name: {type: string, minLength: 1, maxLength: 100}
        dataScope: {$ref: '#/components/schemas/BaseDataScope'}
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      required: [key, name, dataScope, enabled]
      properties:
        key: {type: string, minLength: 3, maxLength: 64, pattern: '^[a-z0-9][a-z0-9_-]*$'}
        name: {type: string, minLength: 1, maxLength: 100}
        dataScope: {$ref: '#/components/schemas/BaseDataScope'}
        enabled: {type: boolean}
    SetRoleGrantsRequest:
      type: object
      additionalProperties: false
      required: [permissionCodes, menuIds]
      properties:
        permissionCodes: {type: array, maxItems: 100, uniqueItems: true, items: {type: string, minLength: 3, maxLength: 100}}
        menuIds: {type: array, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/Identifier'}}
    Menu:
      type: object
      additionalProperties: false
      required: [id, key, label, path, permissionCode, sortOrder, protected]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        key: {type: string, minLength: 3, maxLength: 64, pattern: '^[a-z0-9][a-z0-9_-]*$'}
