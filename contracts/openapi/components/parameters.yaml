PageNumber:
  name: page
  in: query
  required: false
  description: One-based result page.
  schema:
    type: integer
    minimum: 1
    default: 1

PageSize:
  name: pageSize
  in: query
  required: false
  description: Maximum results returned per page.
  schema:
    type: integer
    minimum: 1
    maximum: 200
    default: 20
