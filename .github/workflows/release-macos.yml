name: macOS Universal Release Gate
run-name: macos source=${{ inputs.source_ref }} version=${{ inputs.release_version }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact lowercase 40-character product source SHA
        required: true
        type: string
      release_version:
        description: Product version
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: macOS x86_64 and arm64 signed release candidate
    runs-on: macos-15
    environment: macos-production
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ inputs.source_ref }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      GOENV: "off"
      GOTOOLCHAIN: local

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Verify immutable source and protected credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          for value in \
            "$APPLE_DEVELOPER_ID_P12_BASE64" \
            "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            "$APPLE_SIGNING_IDENTITY" \
            "$APPLE_NOTARY_KEY_P8_BASE64" \
            "$APPLE_NOTARY_KEY_ID" \
            "$APPLE_NOTARY_ISSUER_ID"; do
            test -n "$value"
          done

      - name: Set up Go 1.26.5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go-admin-plus/go.sum

      - name: Set up Node 22.22.3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - name: Set up pinned Rust and workspace
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin
          rustup default 1.96.0
          corepack enable
          corepack install --global pnpm@11.1.3
          pnpm --dir go-admin-plus-ui install --frozen-lockfile

      - name: Verify source and release policy
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/release/macos/verify-policy.test.mjs
          node scripts/release/macos/verify-policy.mjs
          bash -n scripts/release/macos/*.sh
          plutil -lint release/macos/entitlements.plist
          (cd go-admin-plus && go test ./internal/modules/generator ./cmd/desktop-sidecar -count=1)
          pnpm --dir go-admin-plus-ui --filter @go-admin/admin-desktop typecheck
          node release/shared/sidecar/build.mjs --target aarch64-apple-darwin
          pnpm --dir go-admin-plus-ui --filter @go-admin/admin-desktop exec cargo test --manifest-path src-tauri/Cargo.toml --locked
          pnpm --dir go-admin-plus-ui --filter @go-admin/admin-desktop exec cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Import Developer ID and notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/go-admin-plus-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/notary-key.p8"
          chmod 0600 "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
          echo "GO_ADMIN_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Install verified SBOM tool
        shell: bash
        run: |
          set -euo pipefail
          archive=syft_1.51.0_darwin_arm64.tar.gz
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v1.51.0/$archive"
          echo "4f37f4c7fefce0a68e4cf71ba3f5f9829a99e65d89b29f7ee41b8c2c10ea8c59  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" syft
          install -m 0755 syft "$RUNNER_TEMP/syft"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build Universal Tauri app and self-contained Generator runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-work
          scripts/release/macos/build-universal.sh "$RELEASE_VERSION" "${{ github.run_number }}" "release-work/Go Admin Plus.app"
          scripts/release/macos/verify-app.sh "release-work/Go Admin Plus.app" development

      - name: Sign and notarize app
        shell: bash
        run: |
          set -euo pipefail
          scripts/release/macos/sign-app.sh "release-work/Go Admin Plus.app"
          scripts/release/macos/verify-app.sh "release-work/Go Admin Plus.app" signed-production
          scripts/release/macos/notarize.sh app "release-work/Go Admin Plus.app" release-work/app-notary.json

      - name: Package, notarize, and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          basename=$(jq -er '.artifactBasename' release/macos/identity.json)
          dmg="release-work/$basename-$RELEASE_VERSION.dmg"
          scripts/release/macos/package-dmg.sh "release-work/Go Admin Plus.app" "$dmg"
          scripts/release/macos/notarize.sh dmg "$dmg" release-work/dmg-notary.json
          scripts/release/macos/verify-dmg.sh "$dmg"
          scripts/release/macos/verify-install.sh "$dmg" release-work/install-evidence
          jq -s '{schemaVersion:1,app:.[0],dmg:.[1]}' release-work/app-notary.json release-work/dmg-notary.json > release-work/notary.json
          echo "DMG_PATH=$dmg" >> "$GITHUB_ENV"

      - name: Emit checksums, SBOM, and provenance
        shell: bash
        run: |
          scripts/release/macos/emit-artifacts.sh \
            "$RELEASE_VERSION" "$SOURCE_SHA" \
            "release-work/Go Admin Plus.app" "$DMG_PATH" release-work/notary.json release-output
          test -f release-output/SHA256SUMS
          test -f release-output/provenance.json
          test -f release-output/notary.json
          echo 'GO_ADMIN_MACOS_SUPPLY_CHAIN_PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload protected release candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-admin-plus-macos-${{ inputs.release_version }}-${{ inputs.source_ref }}
          path: |
            release-output
            release-work/install-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral credentials
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"
          if [[ -n "${GO_ADMIN_SIGNING_KEYCHAIN:-}" ]]; then
            security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
            security delete-keychain "$GO_ADMIN_SIGNING_KEYCHAIN" || true
          fi
