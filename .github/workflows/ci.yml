name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Root governance and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-admin-plus/go.mod
          cache-dependency-path: go-admin-plus/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: go-admin-plus-ui/pnpm-lock.yaml
      - name: Install managed tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.48.0
          pnpm --dir go-admin-plus-ui install --frozen-lockfile
      - name: Run root quality contract
        run: |
          task governance:check
          task architecture:check
          task compatibility:zero
          task docs:check
          task task:contract
          task contract:lint
          task generate:check

  backend:
    name: Go full matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-admin-plus/go.mod
          cache-dependency-path: go-admin-plus/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: go-admin-plus-ui/pnpm-lock.yaml
      - name: Install generator frontend workspace
        run: pnpm --dir go-admin-plus-ui install --frozen-lockfile
      - name: Test, analyze, and build
        working-directory: go-admin-plus
        run: |
          go test ./... -count=1
          go test -tags sqlite ./... -count=1
          go test -race ./... -count=1
          go vet ./...
          CGO_ENABLED=0 go build ./cmd/go-admin-plus ./cmd/desktop-sidecar
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  postgres-required:
    name: PostgreSQL 17 required matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: go_admin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d go_admin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GO_ADMIN_CI_REQUIRE_POSTGRES: "1"
      GO_ADMIN_TEST_POSTGRES_DISPOSABLE_DSN: postgres://postgres:postgres@127.0.0.1:5432/go_admin_ci?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-admin-plus/go.mod
          cache-dependency-path: go-admin-plus/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: go-admin-plus-ui/pnpm-lock.yaml
      - name: Install generator workspace
        run: pnpm --dir go-admin-plus-ui install --frozen-lockfile --ignore-scripts
      - name: Assert PostgreSQL service health
        run: pg_isready -h 127.0.0.1 -p 5432 -U postgres -d go_admin_ci
      - name: Run non-skippable PostgreSQL suites
        run: node scripts/ci/required-postgres.mjs

  frontend:
    name: pnpm workspace full matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: go-admin-plus-ui/pnpm-lock.yaml
      - name: Install and verify
        working-directory: go-admin-plus-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm check:workspace
          pnpm build

  security-supply-chain:
    name: Vulnerability, secret, SBOM, and drift gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GO_ADMIN_CI_REQUIRE_SECURITY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-admin-plus/go.mod
          cache-dependency-path: go-admin-plus/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: go-admin-plus-ui/pnpm-lock.yaml
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Install locked workspaces and pinned scanners
        run: |
          pnpm --dir go-admin-plus-ui install --frozen-lockfile --ignore-scripts
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Run required supply-chain gates
        run: node scripts/security/required-security.mjs
      - name: Upload redacted security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-evidence
          path: artifacts/security
          if-no-files-found: error
          retention-days: 14

  desktop-rust:
    name: Tauri 2 native build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-admin-plus/go.mod
          cache-dependency-path: go-admin-plus/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: go-admin-plus-ui/pnpm-lock.yaml
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Install frontend workspace
        run: pnpm --dir go-admin-plus-ui install --frozen-lockfile
      - name: Verify and build native host
        run: |
          node release/shared/sidecar/build.mjs --host
          cargo test --manifest-path go-admin-plus-ui/apps/admin-desktop/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path go-admin-plus-ui/apps/admin-desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          pnpm --dir go-admin-plus-ui --filter @go-admin-plus/admin-desktop tauri build \
            --features custom-protocol --no-bundle
          node go-admin-plus-ui/apps/admin-desktop/scripts/verify-build.mjs
