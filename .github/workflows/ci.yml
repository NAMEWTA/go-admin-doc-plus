name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-admin-plus/go.mod
          cache-dependency-path: go-admin-plus/go.sum
      - name: Test
        working-directory: go-admin-plus
        run: go test ./... -count=1

  frontend:
    name: Frontend static, unit and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: go-admin-ui-plus/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: go-admin-ui-plus
        run: pnpm install --frozen-lockfile
      - name: Verify contracts and source
        working-directory: go-admin-ui-plus
        run: pnpm test:ci
      - name: Build production assets
        working-directory: go-admin-ui-plus
        run: pnpm build:prod

  frontend-e2e:
    name: Frontend mocked E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: go-admin-ui-plus/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: go-admin-ui-plus
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: go-admin-ui-plus
        run: pnpm exec playwright install --with-deps chromium
      - name: Run mocked E2E
        working-directory: go-admin-ui-plus
        run: pnpm e2e
        env:
          CI: true

  release-contract:
    name: Release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release contract
        run: |
          node release/manifest/product-release.mjs preflight --version 0.1.0 --root-ref "${GITHUB_SHA}"
          node release/manifest/scan-compatibility.mjs
          node --test release/manifest/product-release.test.mjs
