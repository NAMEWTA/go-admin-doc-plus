name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Root governance and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-admin-plus/go.mod
          cache-dependency-path: go-admin-plus/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: go-admin-plus-ui/pnpm-lock.yaml
      - name: Install managed tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.48.0
          pnpm --dir go-admin-plus-ui install --frozen-lockfile
      - name: Run root quality contract
        run: |
          task governance:check
          task architecture:check
          task compatibility:zero
          task docs:check
          task task:contract
          task contract:lint
          task generate:check

  backend:
    name: Go full matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-admin-plus/go.mod
          cache-dependency-path: go-admin-plus/go.sum
      - name: Test, analyze, and build
        working-directory: go-admin-plus
        run: |
          go test ./... -count=1
          go test -tags sqlite ./... -count=1
          go test -race ./... -count=1
          go vet ./...
          CGO_ENABLED=0 go build ./cmd/go-admin-plus ./cmd/desktop-sidecar ./cmd/config-check ./cmd/migrate
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  frontend:
    name: pnpm workspace full matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: go-admin-plus-ui/pnpm-lock.yaml
      - name: Install and verify
        working-directory: go-admin-plus-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm check:workspace
          pnpm build

  desktop-rust:
    name: Tauri 2 Rust host
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-admin-plus/go.mod
          cache-dependency-path: go-admin-plus/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Verify Rust host
        run: |
          node release/shared/sidecar/build.mjs --host
          cd go-admin-plus-ui/apps/admin-desktop/src-tauri
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo check --locked --release --features custom-protocol
