name: Product Release Candidate Gate
run-name: product source=${{ github.sha }} version=${{ inputs.release_version }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact numeric product version
        required: true
        default: 0.0.1
        type: string
      linux_run_id:
        description: Successful protected Linux run ID
        required: true
        type: string
      linux_artifact_id:
        description: Linux artifact ID
        required: true
        type: string
      macos_run_id:
        description: Successful protected macOS run ID
        required: true
        type: string
      macos_artifact_id:
        description: macOS artifact ID
        required: true
        type: string
      windows_run_id:
        description: Successful protected Windows run ID
        required: true
        type: string
      windows_artifact_id:
        description: Windows artifact ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: product-release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  aggregate:
    name: Verify source and aggregate protected evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact source contract
        run: |
          node release/manifest/product-release.mjs preflight --version '${{ inputs.release_version }}' --root-ref '${{ github.sha }}'
          node scripts/quality/compatibility-zero.mjs
          node --test release/manifest/product-release.test.mjs scripts/quality/*.test.mjs
      - name: Collect immutable platform metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node release/manifest/product-release.mjs collect \
            --version '${{ inputs.release_version }}' \
            --linux-run-id '${{ inputs.linux_run_id }}' --linux-artifact-id '${{ inputs.linux_artifact_id }}' \
            --macos-run-id '${{ inputs.macos_run_id }}' --macos-artifact-id '${{ inputs.macos_artifact_id }}' \
            --windows-run-id '${{ inputs.windows_run_id }}' --windows-artifact-id '${{ inputs.windows_artifact_id }}' \
            --output product-manifest.json
          node release/manifest/product-release.mjs verify --manifest product-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-admin-plus-${{ inputs.release_version }}-product-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: product-manifest.json
          if-no-files-found: error
          retention-days: 14
