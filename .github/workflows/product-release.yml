name: Product Release Candidate Gate

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact numeric product version shared by all three artifacts
        required: true
        default: 0.1.0
        type: string
      linux_run_id:
        description: Successful Linux AMD64 platform workflow run ID
        required: true
        type: string
      linux_artifact_id:
        description: Linux AMD64 artifact ID from that run
        required: true
        type: string
      macos_run_id:
        description: Successful macOS ARM64 platform workflow run ID
        required: true
        type: string
      macos_artifact_id:
        description: macOS ARM64 artifact ID from that run
        required: true
        type: string
      windows_run_id:
        description: Successful Windows AMD64 platform workflow run ID
        required: true
        type: string
      windows_artifact_id:
        description: Windows AMD64 artifact ID from that run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: product-release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  contract-and-source-gate:
    name: Product contract and source gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go 1.26.5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go-admin-plus/go.sum

      - name: Set up Node 22.22.3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - name: Verify product preflight and compatibility contraction
        run: |
          node release/manifest/product-release.mjs preflight \
            --version '${{ inputs.release_version }}' \
            --root-ref '${{ github.sha }}'
          node release/manifest/scan-compatibility.mjs
          node --test release/manifest/product-release.test.mjs

      - name: Run backend contract suite
        working-directory: go-admin-plus
        run: go test ./... -count=1

      - name: Run frontend contract and production build
        working-directory: go-admin-ui-plus
        run: |
          corepack enable
          corepack install --global pnpm@11.1.3
          pnpm install --frozen-lockfile
          pnpm test:ci
          pnpm build:prod

      - name: Collect immutable platform metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node release/manifest/product-release.mjs collect \
            --version '${{ inputs.release_version }}' \
            --linux-run-id '${{ inputs.linux_run_id }}' \
            --linux-artifact-id '${{ inputs.linux_artifact_id }}' \
            --macos-run-id '${{ inputs.macos_run_id }}' \
            --macos-artifact-id '${{ inputs.macos_artifact_id }}' \
            --windows-run-id '${{ inputs.windows_run_id }}' \
            --windows-artifact-id '${{ inputs.windows_artifact_id }}' \
            --output product-manifest.json
          node release/manifest/product-release.mjs verify --manifest product-manifest.json

      - name: Upload product manifest candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-admin-plus-${{ inputs.release_version }}-product-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: product-manifest.json
          if-no-files-found: error
          retention-days: 14
