name: Windows x64 Release Gate
run-name: windows source=${{ inputs.source_ref }} version=${{ inputs.release_version }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact lowercase 40-character product source SHA
        required: true
        type: string
      release_version:
        description: Product version
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Windows x64 signed Tauri NSIS candidate
    runs-on: windows-2025
    environment: windows-production
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ inputs.source_ref }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      AZURE_ARTIFACT_SIGNING_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
      AZURE_ARTIFACT_SIGNING_EXPECTED_THUMBPRINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_EXPECTED_THUMBPRINT }}
      GOENV: "off"
      GOTOOLCHAIN: local

    steps:
      - name: Configure byte-exact checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Verify immutable source and protected inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$' -or
              $env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw 'Source SHA or release version is invalid.'
          }
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA -or (git status --porcelain)) {
            throw 'The checkout does not match the immutable source.'
          }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'An AMD64 runner is required.' }
          foreach ($name in @(
            'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_TENANT_ID',
            'AZURE_ARTIFACT_SIGNING_ENDPOINT', 'AZURE_ARTIFACT_SIGNING_ACCOUNT',
            'AZURE_ARTIFACT_SIGNING_PROFILE', 'AZURE_ARTIFACT_SIGNING_EXPECTED_THUMBPRINT'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing protected input: $name"
            }
          }
          if ($env:AZURE_ARTIFACT_SIGNING_EXPECTED_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'Expected signing certificate thumbprint is invalid.'
          }

      - name: Set up Go 1.26.5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go-admin-plus/go.sum

      - name: Set up Node 22.22.3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - name: Set up pinned Rust, pnpm, signing, and SBOM tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.96.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.96.0
          corepack enable
          corepack install --global pnpm@11.1.3
          pnpm --dir go-admin-plus-ui install --frozen-lockfile
          cargo install artifact-signing-cli --version 0.11.0 --locked
          cargo install tauri-driver --version 2.0.6 --locked
          'C:\Program Files\7-Zip' | Out-File -FilePath $env:GITHUB_PATH -Append
          $archive = Join-Path $env:RUNNER_TEMP 'syft_1.51.0_windows_amd64.zip'
          curl.exe --fail --location --retry 3 --output $archive 'https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_windows_amd64.zip'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fc5ffaeffb993576ece9c791da5a688fb2c8969a1479bbfe58583672c64da336') {
            throw 'Syft archive checksum mismatch.'
          }
          $syft = Join-Path $env:RUNNER_TEMP 'syft'
          Expand-Archive -LiteralPath $archive -DestinationPath $syft
          $syft | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Verify source and Windows release policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --test scripts/release/windows/verify-policy.test.mjs
          node scripts/release/windows/verify-policy.mjs
          Get-ChildItem scripts/release/windows -Filter '*.ps1' | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "PowerShell parse failed: $($_.Name)" }
          }
          Get-Content release/windows/identity.json -Raw | ConvertFrom-Json | Out-Null
          go -C go-admin-plus test ./internal/modules/generator ./cmd/desktop-sidecar -count=1
          pnpm --dir go-admin-plus-ui --filter '@go-admin/admin-desktop' typecheck
          node release/shared/sidecar/build.mjs --target x86_64-pc-windows-msvc
          pnpm --dir go-admin-plus-ui --filter '@go-admin/admin-desktop' exec cargo test --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc
          pnpm --dir go-admin-plus-ui --filter '@go-admin/admin-desktop' exec cargo clippy --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc --all-targets --all-features -- -D warnings

      - name: Build signed x64 Tauri NSIS candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/release/windows/build-nsis.ps1 -Version $env:RELEASE_VERSION -OutputDirectory release-work
          $installer = (Resolve-Path "release-work/go-admin-plus-$env:RELEASE_VERSION-windows-x64-setup.exe").Path
          $application = (Resolve-Path 'release-work/go-admin-plus-desktop.exe').Path
          "INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APPLICATION_PATH=$application" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify install, restart, and uninstall data boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/release/windows/verify-artifacts.ps1 -Version $env:RELEASE_VERSION -InstallerFile $env:INSTALLER_PATH -ApplicationFile $env:APPLICATION_PATH
          ./scripts/release/windows/verify-install.ps1 -InstallerFile $env:INSTALLER_PATH -EvidenceFile release-work/install-evidence.json

      - name: Emit checksums, SBOM, and provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/release/windows/emit-artifacts.ps1 `
            -Version $env:RELEASE_VERSION -SourceSha $env:SOURCE_SHA `
            -InstallerFile $env:INSTALLER_PATH -ApplicationFile $env:APPLICATION_PATH `
            -InstallEvidenceFile release-work/install-evidence.json -OutputDirectory release-output
          foreach ($required in @('SHA256SUMS', 'provenance.json', 'install-evidence.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'release-output' $required))) { throw "Missing evidence: $required" }
          }
          'GO_ADMIN_WINDOWS_SUPPLY_CHAIN_PASS' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload protected Windows candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-admin-plus-windows-${{ inputs.release_version }}-${{ inputs.source_ref }}
          path: release-output
          if-no-files-found: error
          retention-days: 14
