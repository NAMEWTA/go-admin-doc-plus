name: Linux OCI and Compose Release Gate
run-name: linux source=${{ inputs.source_ref }} version=${{ inputs.release_version }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact lowercase 40-character product source SHA
        required: true
        type: string
      release_version:
        description: Product version
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: linux-release-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: linux/amd64 and linux/arm64 release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ inputs.source_ref }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      GO_ADMIN_SERVER_IMAGE: go-admin-plus-server
      GO_ADMIN_WEB_IMAGE: go-admin-plus-web

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Node 22.22.3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - name: Verify release policy and failure fixtures
        run: |
          node --test scripts/release/linux/verify-policy.test.mjs
          node scripts/release/linux/verify-policy.mjs
          bash -n scripts/release/linux/*.sh

      - name: Enable emulated Linux architectures
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: amd64,arm64

      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build both OCI architectures
        run: scripts/release/linux/build-images.sh "$RELEASE_VERSION" "$SOURCE_SHA"

      - name: Prepare ephemeral secret references
        run: |
          scripts/release/linux/prepare-secrets.sh
          cat > deploy/compose/.env <<EOF
          GO_ADMIN_RELEASE_VERSION=$RELEASE_VERSION
          GO_ADMIN_SOURCE_SHA=$SOURCE_SHA
          GO_ADMIN_SERVER_IMAGE=$GO_ADMIN_SERVER_IMAGE
          GO_ADMIN_WEB_IMAGE=$GO_ADMIN_WEB_IMAGE
          GO_ADMIN_WEB_BIND=127.0.0.1
          GO_ADMIN_WEB_PORT=8080
          EOF

      - name: Run architecture and profile matrix
        shell: bash
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            export DOCKER_DEFAULT_PLATFORM="linux/$architecture"
            export GO_ADMIN_VERSION="$SOURCE_SHA-$architecture"
            for profile in postgres sqlite; do
              export GO_ADMIN_COMPOSE_PROJECT="go-admin-plus-${architecture}-${profile}-${{ github.run_id }}-${{ github.run_attempt }}"
              scripts/release/linux/compose.sh "$profile" up -d --wait --wait-timeout 300 "web-$profile"
              scripts/release/linux/verify-compose.sh "$profile" | tee "compose-${architecture}-${profile}.log"
              scripts/release/linux/compose.sh "$profile" down -v --remove-orphans

              export GO_ADMIN_COMPOSE_PROJECT="go-admin-plus-failure-${architecture}-${profile}-${{ github.run_id }}-${{ github.run_attempt }}"
              scripts/release/linux/verify-migration-failure.sh "$profile" | tee "migration-${architecture}-${profile}.log"
            done
          done

      - name: Install verified SBOM tool
        shell: bash
        run: |
          set -euo pipefail
          archive=syft_1.51.0_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v1.51.0/$archive"
          echo "2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f  $archive" | sha256sum -c -
          tar -xzf "$archive" syft
          install -m 0755 syft "$RUNNER_TEMP/syft"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Emit checksums, SBOMs, and provenance
        run: |
          scripts/release/linux/emit-artifacts.sh "$RELEASE_VERSION" "$SOURCE_SHA" release-output
          test -f release-output/SHA256SUMS
          test -f release-output/provenance.json
          test "$(find release-output/sbom -type f | wc -l | tr -d ' ')" = 4
          echo 'GO_ADMIN_LINUX_SUPPLY_CHAIN_PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload local release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-admin-plus-linux-${{ inputs.release_version }}-${{ inputs.source_ref }}
          path: |
            release-output
            compose-*.log
            migration-*.log
          if-no-files-found: error
          retention-days: 14

      - name: Clean isolated Compose projects
        if: always()
        shell: bash
        run: |
          for architecture in amd64 arm64; do
            export DOCKER_DEFAULT_PLATFORM="linux/$architecture"
            export GO_ADMIN_VERSION="$SOURCE_SHA-$architecture"
            for profile in postgres sqlite; do
              export GO_ADMIN_COMPOSE_PROJECT="go-admin-plus-${architecture}-${profile}-${{ github.run_id }}-${{ github.run_attempt }}"
              scripts/release/linux/compose.sh "$profile" down -v --remove-orphans || true
              export GO_ADMIN_COMPOSE_PROJECT="go-admin-plus-failure-${architecture}-${profile}-${{ github.run_id }}-${{ github.run_attempt }}"
              scripts/release/linux/compose.sh "$profile" -f deploy/compose/compose.migration-failure.yml down -v --remove-orphans || true
            done
          done
