name: 功能需求
description: 提议面向用户或开发者的新增能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景、受影响用户和当前限制。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述可观察的结果，不要只描述实现手段。
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 主要范围
      options:
        - 后端 API
        - Web 管理端
        - 桌面应用
        - 部署与发布
        - 开发体验
        - 跨模块
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收方式
      description: 列出完成后可以验证的行为或约束。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
