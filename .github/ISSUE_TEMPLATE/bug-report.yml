name: 缺陷报告
description: 报告可复现的功能、构建、部署或兼容性问题
title: "[Bug] "
labels:
  - bug
body:
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 后端 API
        - Web 管理端
        - 桌面应用
        - Linux Compose
        - 构建或发布
        - 文档
        - 无法确定
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 说明实际行为及其影响。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小、稳定、可重复的步骤。
      placeholder: |
        1. 使用配置...
        2. 执行命令...
        3. 访问或操作...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 填写发布版本或完整 commit SHA。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 包含操作系统、架构、Go、Node.js、浏览器、数据库和部署方式。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志与证据
      description: 粘贴已脱敏的日志、堆栈、截图或最小复现仓库链接，不要提交凭据。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现同一问题。
          required: true
        - label: 我已移除日志和配置中的密码、Token、密钥及个人数据。
          required: true
