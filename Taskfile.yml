version: '3'

silent: true

vars:
  PROFILE: '{{default "server-sqlite" .PROFILE}}'

tasks:
  default:
    desc: List the public product tasks
    cmds:
      - scripts/go-admin-plus/task-list.sh

  dev:
    desc: Start one development target (TARGET=server|web|desktop)
    vars:
      TARGET: '{{default "server" .TARGET}}'
    cmds:
      - scripts/go-admin-plus/dev.sh "{{.TARGET}}" "{{.PROFILE}}"

  build:
    desc: Build product targets (TARGET=all|server|web|desktop)
    vars:
      TARGET: '{{default "all" .TARGET}}'
    cmds:
      - scripts/go-admin-plus/build.sh "{{.TARGET}}" "{{.PROFILE}}"

  test:
    desc: Run backend and frontend non-E2E tests
    cmds:
      - scripts/go-admin-plus/test.sh
      - scripts/go-admin-plus-ui/test.sh

  lint:
    desc: Run backend and frontend static checks
    cmds:
      - scripts/go-admin-plus/lint.sh
      - scripts/go-admin-plus-ui/lint.sh

  generate:
    desc: Regenerate backend and frontend contracts
    cmds:
      - scripts/go-admin-plus/generate.sh
      - scripts/go-admin-plus-ui/generate.sh

  migrate:
    desc: Migrate the selected backend profile database
    cmds:
      - scripts/go-admin-plus/migrate.sh "{{.PROFILE}}"

  package:
    desc: Produce local packages for one target (TARGET=server|web|desktop)
    vars:
      TARGET: '{{default "server" .TARGET}}'
    cmds:
      - scripts/go-admin-plus/package.sh "{{.TARGET}}" "{{.PROFILE}}"

  release:
    desc: Run the local, non-publishing release preflight
    requires:
      vars: [VERSION]
    cmds:
      - scripts/go-admin-plus/release.sh preflight "{{.VERSION}}"

  governance:check:
    desc: Verify root governance ownership and the T-21 legacy inventory
    cmds:
      - scripts/go-admin-plus/governance-check.sh

  task:contract:
    desc: Verify the public task and failure-propagation contract
    cmds:
      - scripts/go-admin-plus/task-contract.sh

  lint:staged:
    desc: Run the repository pre-commit checks
    cmds:
      - scripts/go-admin-plus/lint-staged.sh
      - scripts/go-admin-plus-ui/lint-staged.sh

  task:failure-probe:
    internal: true
    cmds:
      - scripts/go-admin-plus/failure-probe.sh

  release:preflight:
    internal: true
    requires:
      vars: [VERSION]
    cmds:
      - scripts/go-admin-plus/release.sh preflight "{{.VERSION}}"

  release:dispatch:
    internal: true
    requires:
      vars: [VERSION]
    cmds:
      - scripts/go-admin-plus/release.sh dispatch "{{.VERSION}}"

  release:collect:
    internal: true
    requires:
      vars: [VERSION, LINUX_RUN_ID, LINUX_ARTIFACT_ID, MACOS_RUN_ID, MACOS_ARTIFACT_ID, WINDOWS_RUN_ID, WINDOWS_ARTIFACT_ID]
    cmds:
      - >-
        scripts/go-admin-plus/release.sh collect "{{.VERSION}}"
        "{{.LINUX_RUN_ID}}" "{{.LINUX_ARTIFACT_ID}}"
        "{{.MACOS_RUN_ID}}" "{{.MACOS_ARTIFACT_ID}}"
        "{{.WINDOWS_RUN_ID}}" "{{.WINDOWS_ARTIFACT_ID}}"
